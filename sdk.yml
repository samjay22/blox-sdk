# Selene host globals only; service routing is generated by tools/gen.py.
# Fields Schema/Profile share task scheduling and the single game:BindToClose lifecycle.
base: luau
name: sdk
globals:
  warn:
    any: true
  script:
    any: true
  Enum:
    any: true
  Instance.new:
    args:
      - type: string
  game.JobId:
    property: read-only
  game.GameId:
    property: read-only
  game.ServerStorage:
    any: true
  game.SetAttribute:
    method: true
    args:
      - type: string
      - type: any
  game.GetService:
    method: true
    args:
      - type: string
  task.wait:
    args:
      - type: number
  task.spawn:
    args:
      - type: function
  task.delay:
    args:
      - type: number
      - type: function
  task.cancel:
    args:
      - type: any
  game.BindToClose:
    method: true
    args:
      - type: function
